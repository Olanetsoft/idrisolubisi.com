[build]
  command = "npm run build"
  # The Next.js runtime reads the build from .next. This overrides the old
  # Gatsby "public" publish directory still set in the Netlify UI.
  publish = ".next"

[build.environment]
  # Keep in sync with .nvmrc
  NODE_VERSION = "22"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Site images: a returning visitor uses its copy for a day and may keep using
# it while a fresh one loads for a week. Netlify Image CDN passes these
# headers on to the resized versions. Rename a file when its picture changes.
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"
